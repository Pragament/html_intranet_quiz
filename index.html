<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Active Quiz - Quiz Platform</title>
  <meta name="description" content="Enter your name and quiz access code to join the quiz session.">
  <!-- Local CSS -->
  <link rel="stylesheet" href="css/tailwind.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen bg-slate-50 flex flex-col">

  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <!-- Main Student Lobby Content -->
  <main class="flex-1 flex flex-col justify-center items-center px-4 py-12">
    <div class="max-w-md w-full animate-slide-up">
      <!-- Decorative Cap Icon -->
      <div class="flex justify-center mb-6">
        <span class="inline-flex items-center justify-center p-4 bg-blue-50 rounded-2xl text-blue-600">
          <i data-lucide="graduation-cap" class="w-10 h-10"></i>
        </span>
      </div>

      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Join Active Quiz</h1>
        <p class="mt-2 text-slate-600 text-sm">
          Verify your student credentials using your Admission Number & Phone Number to enter the quiz.
        </p>
      </div>

      <!-- Centered White Quiz Card -->
      <div class="bg-white border border-slate-200 shadow-md rounded-2xl p-6 sm:p-8">
        
        <!-- Verified Student Profile Banner (Shown if student is logged in) -->
        <div id="verified-student-card" class="hidden mb-6 p-4 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-between gap-3 animate-fade-in">
          <div class="flex items-center gap-3 min-w-0">
            <span class="p-2.5 bg-blue-600 text-white rounded-xl shadow-sm shrink-0">
              <i data-lucide="graduation-cap" class="w-5 h-5"></i>
            </span>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-bold uppercase tracking-wider text-blue-700 bg-blue-100 px-2 py-0.5 rounded-full">Verified Student</span>
              </div>
              <h3 id="card-student-name" class="text-base font-bold text-slate-900 truncate">Rahul Sharma</h3>
              <p class="text-xs text-slate-600 font-mono">Admission No: <span id="card-student-adm" class="font-semibold text-slate-800">ADM101</span></p>
            </div>
          </div>
          <button
            type="button"
            id="switch-student-btn"
            class="text-xs font-semibold text-blue-700 hover:text-blue-900 bg-white border border-blue-200 hover:bg-blue-50 px-3 py-1.5 rounded-lg transition shadow-2xs shrink-0 cursor-pointer"
            title="Log out and enter different admission credentials"
          >
            Switch Account
          </button>
        </div>

        <form id="join-quiz-form" class="space-y-5" autocomplete="off">
          <!-- Unauthenticated Credentials Section (Hidden if already logged in) -->
          <div id="student-credentials-section" class="space-y-4">
            <div>
              <label for="student-admission" class="block text-sm font-semibold text-slate-700 mb-1">
                Admission Number / Roll No <span class="text-rose-500">*</span>
              </label>
              <div class="relative rounded-md shadow-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i data-lucide="hash" class="h-5 w-5 text-slate-400"></i>
                </div>
                <input id="student-admission" name="admission_number" type="text" autocomplete="off"
                  autocapitalize="characters" spellcheck="false" placeholder="e.g. ADM101 or 1001"
                  class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 placeholder-slate-400 text-sm font-mono font-semibold tracking-wider" />
              </div>
            </div>

            <div>
              <label for="student-phone" class="block text-sm font-semibold text-slate-700 mb-1">
                Registered Phone Number <span class="text-rose-500">*</span>
              </label>
              <div class="relative rounded-md shadow-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i data-lucide="phone" class="h-5 w-5 text-slate-400"></i>
                </div>
                <input id="student-phone" name="phone_number" type="tel" autocomplete="tel"
                  placeholder="e.g. 9876543210"
                  class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 placeholder-slate-400 text-sm font-mono tracking-wider" />
              </div>
              <p class="mt-1 text-xs text-slate-500">Phone number registered in Supabase database.</p>
            </div>
          </div>

          <!-- Hidden input keeping backward compatibility with scripts referencing student-name -->
          <input type="hidden" id="student-name" name="student_name_entry" value="" />

          <div>
            <label for="access-code" class="block text-sm font-semibold text-slate-700 mb-1">
              Quiz Access Code <span class="text-rose-500">*</span>
            </label>
            <div class="relative rounded-md shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i data-lucide="key-round" class="h-5 w-5 text-slate-400"></i>
              </div>
              <input id="access-code" name="quiz_access_code_entry" type="text" required autocomplete="new-password"
                autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text"
                aria-autocomplete="none" data-lpignore="true" data-form-type="other" placeholder="e.g. QUIZ42"
                class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 placeholder-slate-400 text-sm font-mono tracking-wider font-bold" />
            </div>
          </div>

          <button type="button" id="submit-btn"
            class="w-full flex items-center justify-center gap-1.5 py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition cursor-pointer">
            <span id="btn-text">Verify & Start Quiz</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>

          <div class="pt-2 text-center text-xs text-slate-500">
            <span>Want to log in permanently? </span>
            <a href="login.html?role=student" class="font-semibold text-blue-600 hover:text-blue-700 transition">
              Student Login Page &rarr;
            </a>
          </div>
        </form>
      </div>
    </div>
  </main>


  <!-- Local vendor JS -->
  <script src="public/vendor/supabase.js"></script>
  <script src="public/vendor/lucide.min.js"></script>
  <script src="config.js"></script>
  <script src="js/auth.js"></script>

  <!-- Page Logic -->
  <script>
    // If Intranet Quiz configuration is missing from localStorage, direct user to config PIN setup page
    (function checkIntranetConfig() {
      const hasConfig = localStorage.getItem('SUPABASE_URL') && localStorage.getItem('SUPABASE_ANON_KEY');
      const isVerified = sessionStorage.getItem('config_verified') === 'true';
      if (!hasConfig && !isVerified) {
        window.location.href = 'config.html';
      }
    })();

    document.addEventListener('DOMContentLoaded', () => {
      const joinForm = document.getElementById('join-quiz-form');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const accessCodeInput = document.getElementById('access-code');
      const studentNameInput = document.getElementById('student-name');
      const admissionInput = document.getElementById('student-admission');
      const phoneInput = document.getElementById('student-phone');
      const credentialsSection = document.getElementById('student-credentials-section');
      const verifiedCard = document.getElementById('verified-student-card');
      const cardStudentName = document.getElementById('card-student-name');
      const cardStudentAdm = document.getElementById('card-student-adm');
      const switchStudentBtn = document.getElementById('switch-student-btn');

      // Update student UI state based on session
      function refreshStudentUI() {
        const student = typeof window.getStudentSession === 'function' ? window.getStudentSession() : null;
        if (student && (student.admission_number || student.admission_no)) {
          // Student is verified
          if (verifiedCard) verifiedCard.classList.remove('hidden');
          if (credentialsSection) credentialsSection.classList.add('hidden');
          if (cardStudentName) cardStudentName.textContent = student.name || 'Student';
          if (cardStudentAdm) cardStudentAdm.textContent = student.admission_number || student.admission_no;
          if (studentNameInput) studentNameInput.value = student.name || '';
          if (btnText) btnText.textContent = 'Start Quiz';
        } else {
          // Unverified / Guest
          if (verifiedCard) verifiedCard.classList.add('hidden');
          if (credentialsSection) credentialsSection.classList.remove('hidden');
          if (btnText) btnText.textContent = 'Verify & Start Quiz';
        }
        if (window.lucide) window.lucide.createIcons();
      }

      refreshStudentUI();

      // Switch student account
      if (switchStudentBtn) {
        switchStudentBtn.addEventListener('click', () => {
          window.clearStudentSession();
          window.renderHeader(window.currentUser);
          refreshStudentUI();
          if (admissionInput) {
            admissionInput.value = '';
            admissionInput.focus();
          }
          if (phoneInput) phoneInput.value = '';
          window.showToast('Cleared active student session. Please enter admission credentials.', 'info');
        });
      }

      if (admissionInput) {
        admissionInput.addEventListener('input', (e) => {
          e.target.value = e.target.value.toUpperCase();
        });
      }

      if (accessCodeInput) {
        accessCodeInput.addEventListener('input', (e) => {
          e.target.value = e.target.value.toUpperCase();
        });
      }

      async function handleStartQuiz(e) {
        if (e) {
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') e.stopPropagation();
        }

        const accessCode = accessCodeInput ? accessCodeInput.value.trim() : '';
        if (!accessCode) {
          window.showToast('Please enter the Quiz Access Code.', 'error');
          if (accessCodeInput) accessCodeInput.focus();
          return false;
        }

        let student = typeof window.getStudentSession === 'function' ? window.getStudentSession() : null;

        // If not already logged in, verify admission number and phone number against Supabase public.students
        if (!student || (!student.admission_number && !student.admission_no)) {
          const admNo = admissionInput ? admissionInput.value.trim() : '';
          const phoneNo = phoneInput ? phoneInput.value.trim() : '';

          if (!admNo) {
            window.showToast('Please enter your Admission Number.', 'error');
            if (admissionInput) admissionInput.focus();
            return false;
          }

          if (!phoneNo) {
            window.showToast('Please enter your registered Phone Number.', 'error');
            if (phoneInput) phoneInput.focus();
            return false;
          }

          if (submitBtn) submitBtn.disabled = true;
          if (btnText) btnText.textContent = 'Verifying Student...';

          const verifyRes = await window.verifyStudentCredentials(admNo, phoneNo);

          if (!verifyRes.success || !verifyRes.student) {
            window.showToast(verifyRes.error || 'Student credentials not found in Supabase records.', 'error');
            if (submitBtn) submitBtn.disabled = false;
            if (btnText) btnText.textContent = 'Verify & Start Quiz';
            return false;
          }

          // Successfully matched student record in Supabase
          student = window.setStudentSession(verifyRes.student);
          refreshStudentUI();
          window.renderHeader(window.currentUser);
        }

        const resolvedStudentName = (student.name || student.student_name || 'Student').trim();
        const resolvedAdmNo = student.admission_number || student.admission_no || '';

        if (submitBtn) submitBtn.disabled = true;
        if (btnText) btnText.textContent = 'Checking Quiz Access...';

        try {
          if (typeof window.ensureSupabaseClient === 'function') {
            await window.ensureSupabaseClient();
          }

          if (window.supabaseClient) {
            // 1. Verify quiz exists
            const { data: quizData, error: qError } = await window.supabaseClient
              .from('quizzes')
              .select('id, title')
              .ilike('access_code', accessCode)
              .maybeSingle();

            if (qError) throw qError;

            if (!quizData) {
              window.showToast(`Quiz with code "${accessCode}" not found.`, 'error');
              if (submitBtn) submitBtn.disabled = false;
              if (btnText) btnText.textContent = 'Start Quiz';
              return false;
            }

            // 2. Check if student has already attempted this quiz (by student_name or admission_number)
            let existingQuery = window.supabaseClient
              .from('student_results')
              .select('id, student_name')
              .eq('quiz_id', quizData.id);

            const { data: existingResults, error: rError } = await existingQuery;

            if (rError) console.warn('Result check warning:', rError);

            if (existingResults && existingResults.length > 0) {
              const alreadyAttempted = existingResults.some(r => {
                const rName = String(r.student_name || '').toLowerCase();
                return rName === resolvedStudentName.toLowerCase() ||
                       (resolvedAdmNo && rName.includes(resolvedAdmNo.toLowerCase()));
              });

              if (alreadyAttempted) {
                window.showToast(`Student "${resolvedStudentName}" has already attempted this quiz. Multiple attempts are not permitted.`, 'error');
                if (submitBtn) submitBtn.disabled = false;
                if (btnText) btnText.textContent = 'Start Quiz';
                return false;
              }
            }
          }
        } catch (err) {
          console.warn('Pre-check error:', err);
        }

        if (btnText) btnText.textContent = 'Entering Lobby...';

        // Store student name in sessionStorage and localStorage
        sessionStorage.setItem('studentName', resolvedStudentName);
        localStorage.setItem('studentName', resolvedStudentName);
        if (resolvedAdmNo) {
          sessionStorage.setItem('studentAdmissionNo', resolvedAdmNo);
          localStorage.setItem('studentAdmissionNo', resolvedAdmNo);
        }

        window.showToast(`Welcome, ${resolvedStudentName}! Entering Quiz Lobby...`, 'success');

        // Route to quiz page with code and name URL parameters
        const targetUrl = `quiz.html?code=${encodeURIComponent(accessCode)}&name=${encodeURIComponent(resolvedStudentName)}`;
        window.location.assign(targetUrl);
        return false;
      }

      if (submitBtn) {
        submitBtn.addEventListener('click', handleStartQuiz);
      }

      if (joinForm) {
        joinForm.addEventListener('submit', handleStartQuiz);
      }

      // Auto-handle URL query params if page was loaded with form inputs
      const urlParams = new URLSearchParams(window.location.search);
      const urlCode = urlParams.get('quiz_access_code_entry') || urlParams.get('quiz_code') || urlParams.get('code');
      const urlAdm = urlParams.get('adm') || urlParams.get('admission') || urlParams.get('admission_number');

      if (urlCode && accessCodeInput) {
        accessCodeInput.value = urlCode.toUpperCase();
      }
      if (urlAdm && admissionInput) {
        admissionInput.value = urlAdm.toUpperCase();
      }

      if (window.location.search && (urlCode || urlAdm)) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      // Header & Auth check (runs asynchronously without blocking submit handlers)
      window.checkAuth()
        .then(user => {
          window.renderHeader(user);
          refreshStudentUI();
        })
        .catch(err => console.warn('checkAuth error:', err));
    });
  </script>
</body>

</html>
