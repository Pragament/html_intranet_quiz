<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Authentication - Quiz Platform</title>
  <!-- Local CSS -->
  <link rel="stylesheet" href="css/tailwind.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .form-control {
      display: block;
      width: 100%;
      padding-left: 2.5rem;
      padding-right: 0.75rem;
      padding-top: 0.625rem;
      padding-bottom: 0.625rem;
      border-width: 1px;
      border-color: #cbd5e1;
      border-radius: 0.75rem;
      color: #0f172a;
      font-size: 0.875rem;
      line-height: 1.25rem;
      background-color: #ffffff;
    }
    .form-control:focus {
      outline: 2px solid transparent;
      outline-offset: 2px;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px #3b82f6;
    }
    .form-control::placeholder {
      color: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col relative">

  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <div class="flex-1 flex flex-col justify-center py-12 sm:px-6 lg:px-8">


  <div class="sm:mx-auto sm:w-full sm:max-w-md animate-slide-up">
    <!-- Role Switcher Tabs -->
    <div class="flex p-1.5 bg-slate-200/90 rounded-2xl mb-6 shadow-inner border border-slate-200">
      <button
        type="button"
        id="role-tab-student"
        class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm cursor-pointer"
      >
        <i data-lucide="graduation-cap" class="w-4 h-4"></i>
        <span>Student Login</span>
      </button>
      <button
        type="button"
        id="role-tab-teacher"
        class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900 cursor-pointer"
      >
        <i data-lucide="school" class="w-4 h-4"></i>
        <span>Teacher Login</span>
      </button>
    </div>

    <div class="flex justify-center">
      <span id="auth-icon-badge" class="inline-flex items-center justify-center p-3.5 bg-blue-600 rounded-2xl text-white shadow-lg shadow-blue-200 transition-colors">
        <i id="auth-main-icon" data-lucide="graduation-cap" class="w-8 h-8 text-white"></i>
      </span>
    </div>
    <h2 id="auth-title" class="mt-5 text-center text-3xl font-extrabold text-slate-900 tracking-tight">
      Student Login
    </h2>
    <p id="auth-subtitle-student" class="mt-2 text-center text-sm text-slate-600">
      Enter your Admission Number and registered Phone Number to sign in.
    </p>
    <p id="auth-subtitle-teacher" class="hidden mt-2 text-center text-sm text-slate-600">
      Or
      <button
        id="toggle-auth-mode"
        class="font-medium text-blue-600 hover:text-blue-500 transition-colors duration-200 cursor-pointer"
      >
        register for a new account
      </button>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md animate-slide-up">
    <div class="bg-white py-8 px-4 shadow-md sm:rounded-2xl sm:px-10 border border-slate-100">
      <!-- Error / Success Alert Box -->
      <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

      <!-- Student Login Form -->
      <form id="student-login-form" class="space-y-5" autocomplete="off">
        <div>
          <label for="admission-number" class="block text-sm font-semibold text-slate-700 mb-1">
            Admission Number / Student ID <span class="text-rose-500">*</span>
          </label>
          <div class="relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i data-lucide="hash" class="h-5 w-5 text-slate-400"></i>
            </div>
            <input
              type="text"
              id="admission-number"
              required
              placeholder="e.g. ADM101 or 1001"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              class="form-control font-mono tracking-wider font-semibold text-slate-900 placeholder:font-normal"
            />
          </div>
          <p class="mt-1 text-xs text-slate-500">Your unique admission or roll number registered in school/college.</p>
        </div>

        <div>
          <label for="phone-number" class="block text-sm font-semibold text-slate-700 mb-1">
            Registered Phone Number <span class="text-rose-500">*</span>
          </label>
          <div class="relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i data-lucide="phone" class="h-5 w-5 text-slate-400"></i>
            </div>
            <input
              type="tel"
              id="phone-number"
              required
              placeholder="e.g. 9876543210"
              autocomplete="tel"
              class="form-control font-mono tracking-wider text-slate-900"
            />
          </div>
          <p class="mt-1 text-xs text-slate-500">Must match the phone number registered in the database.</p>
        </div>

        <div class="pt-2">
          <button
            type="submit"
            id="student-submit-btn"
            class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 cursor-pointer"
          >
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span id="student-btn-text">Sign in as Student</span>
          </button>
        </div>

        <div class="text-center pt-2">
          <a href="index.html" class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition">
            Go to Quiz Access Lobby &rarr;
          </a>
        </div>
      </form>

      <!-- Teacher Auth Form (Hidden in Student mode) -->
      <form id="auth-form" class="hidden space-y-6">
        <!-- Full Name Group (Hidden in Sign In mode) -->
        <div id="fullname-group" class="hidden">
          <label for="fullname" class="block text-sm font-semibold text-slate-700">
            Full Name
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i data-lucide="user" class="h-5 w-5 text-slate-400"></i>
            </div>
            <input
              id="fullname"
              type="text"
              placeholder="Jane Doe"
              autocomplete="off"
              class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-900 placeholder-slate-400 text-sm"
            />
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700">
            Email address
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i>
            </div>
            <!-- Email Input Field -->
            <input type="email" id="email" class="form-control" placeholder="Enter your email" readonly onfocus="this.removeAttribute('readonly');">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700">
            Password
          </label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i data-lucide="lock" class="h-5 w-5 text-slate-400"></i>
            </div>
            <!-- Password Input Field -->
            <input type="password" id="password" class="form-control" placeholder="Enter your password" readonly onfocus="this.removeAttribute('readonly');">
          </div>
        </div>

        <div>
          <button
            type="submit"
            id="auth-submit-btn"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 cursor-pointer"
          >
            Sign in
          </button>
        </div>
      </form>

      <!-- Google OAuth Section (Hidden in Student mode) -->
      <div id="google-auth-section" class="hidden mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-slate-500">Or continue with</span>
          </div>
        </div>

        <div class="mt-6">
          <button
            type="button"
            id="google-login-btn"
            class="w-full inline-flex justify-center items-center py-3 px-4 border border-slate-300 rounded-xl shadow-sm bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 cursor-pointer"
          >
            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            Sign in with Google
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Local vendor JS -->
  <script src="public/vendor/supabase.js"></script>
  <script src="public/vendor/lucide.min.js"></script>
  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
